title: How long to wait before a retry
type: function
difficulty: warm-up
tags: [retries, backoff, rate limits]
hints:
  - Without a retry_after, the delay doubles with each attempt, starting from base, and never goes above cap.
  - "A retry_after of 0 means \"retry now\", so check it with is not None rather than relying on truthiness."
  - "return retry_after if retry_after is not None else min(cap, base * 2 ** attempt)"
