title: Serve older clients too
type: function
difficulty: core
tags: [mcp, initialize, protocol-version, dual-era, compatibility]
hints:
  - 'In handle, after the notification check, send method == "initialize" to its own method before any version check: older clients have no _meta to check.'
  - 'initialize reads (message.get("params") or {}).get("protocolVersion"), refuses a non-str with -32602, and sets self.legacy_version to the requested version if it''s in LEGACY_VERSIONS, else LEGACY_VERSIONS[0].'
  - 'Run version_error only when self.legacy_version is None or the request has META + "protocolVersion" in its _meta. Otherwise go straight to self.dispatch(message).'
