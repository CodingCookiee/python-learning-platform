title: Reciprocal rank fusion
type: function
difficulty: core
tags: [hybrid-search, rrf, ranking, dicts]
hints:
  - "Walk each ranking with enumerate(ranking, start=1) and add 1 / (k + rank) to a dict of scores. A dict keeps insertion order, which is first-appearance order."
  - Keep a set of the ids already seen in the current ranking, and skip repeats, so only an id's best rank in that list counts.
  - "sorted(scores.items(), key=lambda item: -item[1]) is stable, so ties stay in first-appearance order."
