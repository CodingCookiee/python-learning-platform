title: Add an application, find a company's roles
type: function
difficulty: core
packages: [sqlalchemy]
tags: [sqlalchemy, session, select, relationships, get-or-create]
hints:
  - "Look the company up first: session.scalars(select(Company).where(Company.name == company_name)).one_or_none(). If that's None, make a new Company."
  - "Application(role=role, applied_on=applied_on, company=company), then session.add() it. Setting the relationship is enough; the flush fills in company_id."
  - "For applications_at, select(Application.role).join(Application.company).where(Company.name == company_name).order_by(Application.applied_on), run with session.scalars(...).all()."
