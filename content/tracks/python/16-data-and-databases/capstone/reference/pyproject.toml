[project]
name = "jobtracker"
version = "0.1.0"
description = "Track job applications and interview stages, with a weekly report"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "alembic>=1.14",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-cov>=6", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
