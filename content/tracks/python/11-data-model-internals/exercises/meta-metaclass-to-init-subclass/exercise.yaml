title: Retire an unnecessary metaclass
type: refactor
difficulty: core
tags: [metaclass, init-subclass, abc, refactoring]
hints:
  - "Everything PluginMeta.__new__ does happens after the class is created, which is exactly when __init_subclass__ runs. Move the body into Plugin.__init_subclass__(cls, **kwargs) and delete the metaclass."
  - "PluginMeta checked namespace.get(\"name\") to see only the class's own name. The same test on a finished class is vars(cls).get(\"name\"). Keep the registry on Plugin: Plugin.registry = {}."
  - "With no custom metaclass, type(Plugin) is type again, and mixing Plugin with ABC just works because ABCMeta is a subclass of type."
