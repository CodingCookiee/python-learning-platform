title: "Predict: which tests does pytest find?"
type: predict
difficulty: core
tags: [pytest, collection, naming]
packages: [pytest]
timeout: 20
hints:
  - "pytest imports test_*.py and *_test.py files only, so nothing in checkout_helpers.py is collected."
