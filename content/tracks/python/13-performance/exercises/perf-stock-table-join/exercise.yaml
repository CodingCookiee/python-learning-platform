title: A report builder that isn't quadratic
type: refactor
difficulty: core
timeout: 10
tags: [strings, join, complexity, speed]
hints:
  - Every html = html + ... copies the whole table so far into a new string, several times per row, so the work grows with the square of the number of rows.
  - Collect the pieces in a list, starting with "<table>\n" and HEADER, append one string per row, and return "".join(pieces) at the end.
  - An f-string can build a whole row in one go. Keep the text exactly the same, including the "\n" after each row.
