# The invoicer's logging config: main.configure() passes it to logging.config.dictConfig
version = 1
disable_existing_loggers = false

[formatters.console]
format = "%(levelname)s %(name)s: %(message)s"

[formatters.file]
format = "%(asctime)s %(levelname)s %(name)s: %(message)s"

[handlers.console]
class = "logging.StreamHandler"
stream = "ext://sys.stdout"
formatter = "console"
level = "INFO"

[handlers.file]
class = "logging.FileHandler"
filename = "invoicer.log"
encoding = "utf-8"
formatter = "file"
level = "DEBUG"

[loggers.httpx]
level = "WARNING"

[root]
level = "DEBUG"
handlers = ["console", "file"]
